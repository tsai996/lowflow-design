name: Bug report
description: Report a reproducible problem in lowflow-design.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Remove credentials and private workflow data before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence or repository that reproduces the problem.
      placeholder: |
        1. Add an approval node
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Sanitized workflow JSON
      description: Include only the minimal relevant JSON, with private values removed.
      render: json
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private data.
          required: true
        - label: This is not a security vulnerability.
          required: true
